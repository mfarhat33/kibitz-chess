# Keeps the gh-pages branch identical to main, so the site updates whichever branch
# GitHub Pages is set to publish from.
name: Keep gh-pages in sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-gh-pages
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror main to gh-pages
        run: git push origin HEAD:refs/heads/gh-pages --force
