<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kibitz Chess</title>
<meta name="description" content="Free personal chess training: play Stockfish bots, review your games, solve rated puzzles, drill openings and track your progress.">
<meta name="theme-color" content="#f4f2ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kibitz">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  (function () {
    var s = {};
    try { s = JSON.parse(localStorage.getItem('kibitz:theme-cache') || '{}'); } catch (e) {}
    var dark = s.theme === 'dark' || (s.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.documentElement.dataset.board = s.board || 'slate';
    document.documentElement.dataset.pieces = s.pieces || 'cburnett';
  })();
</script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/play" aria-label="Kibitz Chess home"><span id="logo"></span><span>Kibitz <b>Chess</b></span></a>
  <nav class="nav" id="nav" aria-label="Main">
    <a href="#/play" data-tab="play"><span data-icon="play"></span><span>Play</span></a>
    <a href="#/puzzles" data-tab="puzzles"><span data-icon="puzzle"></span><span>Puzzles</span></a>
    <a href="#/learn" data-tab="learn"><span data-icon="learn"></span><span>Learn</span></a>
    <a href="#/openings" data-tab="openings"><span data-icon="book"></span><span>Openings</span></a>
    <a href="#/insights" data-tab="insights"><span data-icon="chart"></span><span>Insights</span></a>
  </nav>
  <span class="spacer"></span>
  <div class="top-actions">
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
    <a class="icon-btn" id="settings-link" href="#/settings" aria-label="Settings"><span data-icon="settings"></span></a>
  </div>
</header>
<main id="view" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">Kibitz Chess needs JavaScript.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
